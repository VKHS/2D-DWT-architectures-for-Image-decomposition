<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>Fused lifting processing element</title><desc>Predict–update signal flow · exact scaled arithmetic · ARCH 1 and shared phase primitive in ARCH 5</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#647b92"/></marker><marker id="ctrl" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#95713a"/></marker></defs><rect width="1200" height="680" fill="#f7f9fc"/><rect width="1200" height="86" fill="#e8f0f8"/><g font-family="Arial, sans-serif" fill="#14283e"><text x="28" y="35" font-size="27" font-weight="700" fill="#14283e" text-anchor="start">Fused lifting processing element</text><text x="29" y="62" font-size="15" font-weight="400" fill="#52667d" text-anchor="start">Predict–update signal flow · exact scaled arithmetic · ARCH 1 and shared phase primitive in ARCH 5</text><rect x="45" y="112" width="330" height="70" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="210" y="142.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Previous even/odd neighborhood</text><text x="210" y="161.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">a, b, c</text><rect x="435" y="112" width="330" height="70" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="600" y="142.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Center even sample</text><text x="600" y="161.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">c</text><rect x="825" y="112" width="330" height="70" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="990" y="142.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Next even/odd neighborhood</text><text x="990" y="161.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">c, d, e</text><rect x="45" y="237" width="330" height="86" rx="8" fill="#d8eee6" stroke="#a2b4c7" stroke-width="1.5"/><text x="210" y="275.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Predict left</text><text x="210" y="294.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">dm = 2b − a − c</text><rect x="435" y="237" width="330" height="86" rx="8" fill="#ffffff" stroke="#a2b4c7" stroke-width="1.5"/><text x="600" y="275.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Scale even</text><text x="600" y="294.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">8c = c &lt;&lt; 3</text><rect x="825" y="237" width="330" height="86" rx="8" fill="#d8eee6" stroke="#a2b4c7" stroke-width="1.5"/><text x="990" y="275.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Predict right</text><text x="990" y="294.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">dp = 2d − c − e</text><polyline points="210,182 210,237" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><polyline points="600,182 600,237" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><polyline points="990,182 990,237" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="355" y="392" width="490" height="76" rx="8" fill="#d8eee6" stroke="#a2b4c7" stroke-width="1.5"/><text x="600" y="425.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Update / low-pass numerator</text><text x="600" y="444.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">L8 = 8c + dm + dp</text><polyline points="210,323 210,361 435,361 435,392" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="310" y="353" font-size="12" font-weight="400" fill="#52667d" text-anchor="middle">dm</text><polyline points="600,323 600,392" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="600" y="349.5" font-size="12" font-weight="400" fill="#52667d" text-anchor="middle">8c</text><polyline points="990,323 990,361 765,361 765,392" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="898" y="353" font-size="12" font-weight="400" fill="#52667d" text-anchor="middle">dp</text><rect x="355" y="518" width="490" height="60" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="600" y="553" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">low8 = L8</text><polyline points="600,468 600,518" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="880" y="421" width="275" height="65" rx="8" fill="#ffffff" stroke="#a2b4c7" stroke-width="1.5"/><text x="1017.5" y="449" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Scale detail</text><text x="1017.5" y="468" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">dp &lt;&lt; 2</text><polyline points="1090,323 1090,421" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="1090" y="364" font-size="12" font-weight="400" fill="#52667d" text-anchor="middle">dp</text><rect x="880" y="518" width="275" height="60" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="1017.5" y="553" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">high8 = 4dp</text><polyline points="1018,486 1018,518" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="35" y="620" font-size="13" font-weight="400" fill="#52667d" text-anchor="start">ARCH 1: both predictions and update are evaluated within one pair-compute clock.</text><text x="35" y="644" font-size="13" font-weight="400" fill="#52667d" text-anchor="start">ARCH 5: the prediction operation is selected in two phases and stored before the third-phase update.</text></g></svg>