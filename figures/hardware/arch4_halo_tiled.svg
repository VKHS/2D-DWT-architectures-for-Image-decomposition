<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="685" viewBox="0 0 1200 685" role="img"><title>Halo-tiled direct 2-D FIR</title><desc>ARCH=4 · tile in coefficient space · global periodic halo · local 2-D window</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#647b92"/></marker><marker id="ctrl" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#95713a"/></marker></defs><rect width="1200" height="685" fill="#f7f9fc"/><rect width="1200" height="86" fill="#e8f0f8"/><g font-family="Arial, sans-serif" fill="#14283e"><text x="28" y="35" font-size="27" font-weight="700" fill="#14283e" text-anchor="start">Halo-tiled direct 2-D FIR</text><text x="29" y="62" font-size="15" font-weight="400" fill="#52667d" text-anchor="start">ARCH=4 · tile in coefficient space · global periodic halo · local 2-D window</text><text x="27" y="111" font-size="14" font-weight="700" fill="#52667d" text-anchor="start">DATA PATH</text><rect x="28" y="130" width="192" height="86" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="124" y="168.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Input frame</text><text x="124" y="187.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">N × 8 bits</text><polyline points="220,173 266,173" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="266" y="130" width="192" height="86" rx="8" fill="#ffffff" stroke="#a2b4c7" stroke-width="1.5"/><text x="362" y="168.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Halo loader</text><text x="362" y="187.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">one pixel / clock</text><polyline points="458,173 504,173" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="504" y="130" width="192" height="86" rx="8" fill="#d8eee6" stroke="#a2b4c7" stroke-width="1.5"/><text x="600" y="168.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Patch store</text><text x="600" y="187.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">P × P × 8 bits</text><polyline points="696,173 742,173" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="742" y="130" width="192" height="86" rx="8" fill="#ffffff" stroke="#a2b4c7" stroke-width="1.5"/><text x="838" y="168.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">4 local sums</text><text x="838" y="187.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">T² quartets</text><polyline points="934,173 980,173" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="980" y="130" width="192" height="86" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="1076" y="168.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Output frame</text><text x="1076" y="187.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">N × 32 bits</text><rect x="29" y="266" width="343" height="83" rx="8" fill="#fff1d2" stroke="#a2b4c7" stroke-width="1.5"/><text x="200.5" y="293.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">TILE_FILL / EMIT</text><text x="200.5" y="312.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">fill P² clocks</text><text x="200.5" y="331.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">emit T² clocks</text><rect x="430" y="266" width="343" height="83" rx="8" fill="#fff1d2" stroke="#a2b4c7" stroke-width="1.5"/><text x="601.5" y="293.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Tile address generator</text><text x="601.5" y="312.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">ty, tx, py, px</text><text x="601.5" y="331.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">global wrap</text><rect x="831" y="266" width="341" height="83" rx="8" fill="#e9e5f7" stroke="#a2b4c7" stroke-width="1.5"/><text x="1001.5" y="293.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Local patch</text><text x="1001.5" y="312.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">P = 2T + 3</text><text x="1001.5" y="331.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">no seams at tile border</text><polyline points="372,307 430,307" fill="none" stroke="#95713a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ctrl)"/><polyline points="601,266 601,244 362,244 362,216" fill="none" stroke="#95713a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ctrl)"/><polyline points="201,266 201,235 838,235 838,216" fill="none" stroke="#95713a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ctrl)"/><polyline points="1001,266 1001,250 600,250 600,216" fill="none" stroke="#95713a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ctrl)"/><text x="27" y="395" font-size="14" font-weight="700" fill="#52667d" text-anchor="start">CONTROLLER SCHEDULE</text><rect x="28" y="412" width="214.4" height="66" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="135.2" y="440.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">LOAD</text><text x="135.2" y="459.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">N input handshakes</text><polyline points="242.4,445 260.4,445" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="260.4" y="412" width="214.4" height="66" rx="8" fill="#d8eee6" stroke="#a2b4c7" stroke-width="1.5"/><text x="367.59999999999997" y="440.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">FILL</text><text x="367.59999999999997" y="459.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">P² clocks</text><polyline points="474.79999999999995,445 492.79999999999995,445" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="492.8" y="412" width="214.4" height="66" rx="8" fill="#d8eee6" stroke="#a2b4c7" stroke-width="1.5"/><text x="600" y="440.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">EMIT</text><text x="600" y="459.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">T² clocks</text><polyline points="707.2,445 725.2,445" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="725.2" y="412" width="214.4" height="66" rx="8" fill="#d8eee6" stroke="#a2b4c7" stroke-width="1.5"/><text x="832.4000000000001" y="440.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">REPEAT</text><text x="832.4000000000001" y="459.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">N/(4T²) tiles</text><polyline points="939.6,445 957.6,445" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="957.6" y="412" width="214.4" height="66" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="1064.8" y="440.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">DRAIN</text><text x="1064.8" y="459.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">N output handshakes</text><text x="28" y="517" font-size="18" font-weight="700" fill="#14283e" text-anchor="start">Compute: N(P²+T²)/(4T²) clocks · working store: 8P² bits</text><text x="28" y="550" font-size="13" font-weight="400" fill="#52667d" text-anchor="start">T is the number of coefficient locations per side, not the raw image tile width.</text><text x="28" y="575" font-size="13" font-weight="400" fill="#52667d" text-anchor="start">Local centers are (2py+2,2px+2); a ±2 stencil fits within the allocated patch.</text><text x="28" y="600" font-size="13" font-weight="400" fill="#52667d" text-anchor="start">Tile origins advance by T in coefficient space. H/2 and W/2 must both be divisible by T.</text><text x="28" y="657" font-size="13" font-weight="400" fill="#52667d" text-anchor="start">Data path illustration is logical, not a physical post-synthesis netlist. Input/output stalls are excluded from compute clocks.</text></g></svg>