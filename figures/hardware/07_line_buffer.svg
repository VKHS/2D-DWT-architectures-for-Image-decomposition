<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img"><title>Line-buffer refill versus rotating-buffer optimization</title><desc>ARCH 3 stores five horizontal rows; current RTL refills, while a future circular schedule may retain overlap</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#647b92"/></marker><marker id="ctrl" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#95713a"/></marker></defs><rect width="1200" height="580" fill="#f7f9fc"/><rect width="1200" height="86" fill="#e8f0f8"/><g font-family="Arial, sans-serif" fill="#14283e"><text x="28" y="35" font-size="27" font-weight="700" fill="#14283e" text-anchor="start">Line-buffer refill versus rotating-buffer optimization</text><text x="29" y="62" font-size="15" font-weight="400" fill="#52667d" text-anchor="start">ARCH 3 stores five horizontal rows; current RTL refills, while a future circular schedule may retain overlap</text><text x="38" y="119" font-size="19" font-weight="700" fill="#14283e" text-anchor="start">Group oy: five row slots</text><rect x="38" y="137" width="375" height="47" rx="5" fill="#dce9f8" stroke="#98abc0"/><text x="56" y="166" font-size="16" font-weight="700" fill="#14283e" text-anchor="start">r = 2oy−2</text><text x="392" y="166" font-size="13" font-weight="400" fill="#52667d" text-anchor="end">Lx | Hx</text><rect x="38" y="188" width="375" height="47" rx="5" fill="#dce9f8" stroke="#98abc0"/><text x="56" y="217" font-size="16" font-weight="700" fill="#14283e" text-anchor="start">r = 2oy−1</text><text x="392" y="217" font-size="13" font-weight="400" fill="#52667d" text-anchor="end">Lx | Hx</text><rect x="38" y="239" width="375" height="47" rx="5" fill="#d8eee6" stroke="#98abc0"/><text x="56" y="268" font-size="16" font-weight="700" fill="#14283e" text-anchor="start">r = 2oy</text><text x="392" y="268" font-size="13" font-weight="400" fill="#52667d" text-anchor="end">Lx | Hx</text><rect x="38" y="290" width="375" height="47" rx="5" fill="#d8eee6" stroke="#98abc0"/><text x="56" y="319" font-size="16" font-weight="700" fill="#14283e" text-anchor="start">r = 2oy+1</text><text x="392" y="319" font-size="13" font-weight="400" fill="#52667d" text-anchor="end">Lx | Hx</text><rect x="38" y="341" width="375" height="47" rx="5" fill="#d8eee6" stroke="#98abc0"/><text x="56" y="370" font-size="16" font-weight="700" fill="#14283e" text-anchor="start">r = 2oy+2</text><text x="392" y="370" font-size="13" font-weight="400" fill="#52667d" text-anchor="end">Lx | Hx</text><text x="778" y="119" font-size="19" font-weight="700" fill="#14283e" text-anchor="start">Group oy+1: source rows</text><rect x="778" y="137" width="375" height="47" rx="5" fill="#d8eee6" stroke="#98abc0"/><text x="796" y="166" font-size="16" font-weight="700" fill="#14283e" text-anchor="start">r = 2oy</text><text x="1132" y="166" font-size="13" font-weight="400" fill="#52667d" text-anchor="end">Lx | Hx</text><rect x="778" y="188" width="375" height="47" rx="5" fill="#d8eee6" stroke="#98abc0"/><text x="796" y="217" font-size="16" font-weight="700" fill="#14283e" text-anchor="start">r = 2oy+1</text><text x="1132" y="217" font-size="13" font-weight="400" fill="#52667d" text-anchor="end">Lx | Hx</text><rect x="778" y="239" width="375" height="47" rx="5" fill="#d8eee6" stroke="#98abc0"/><text x="796" y="268" font-size="16" font-weight="700" fill="#14283e" text-anchor="start">r = 2oy+2</text><text x="1132" y="268" font-size="13" font-weight="400" fill="#52667d" text-anchor="end">Lx | Hx</text><rect x="778" y="290" width="375" height="47" rx="5" fill="#fff1d2" stroke="#98abc0"/><text x="796" y="319" font-size="16" font-weight="700" fill="#14283e" text-anchor="start">r = 2oy+3</text><text x="1132" y="319" font-size="13" font-weight="400" fill="#52667d" text-anchor="end">Lx | Hx</text><rect x="778" y="341" width="375" height="47" rx="5" fill="#fff1d2" stroke="#98abc0"/><text x="796" y="370" font-size="16" font-weight="700" fill="#14283e" text-anchor="start">r = 2oy+4</text><text x="1132" y="370" font-size="13" font-weight="400" fill="#52667d" text-anchor="end">Lx | Hx</text><polyline points="413,262 580,262 580,160 778,160" fill="none" stroke="#95713a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ctrl)"/><polyline points="413,313 580,313 580,211 778,211" fill="none" stroke="#95713a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ctrl)"/><polyline points="413,364 580,364 580,262 778,262" fill="none" stroke="#95713a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ctrl)"/><rect x="443" y="410" width="310" height="78" rx="8" fill="#fff1d2" stroke="#a2b4c7" stroke-width="1.5"/><text x="598" y="444.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Current: refill 5 rows</text><text x="598" y="463.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">Future: retain 3 + fetch 2</text><text x="38" y="526" font-size="13" font-weight="400" fill="#52667d" text-anchor="start">Every slot contains W signed horizontal coefficients. For a packed column k, the vertical PE reads k, W+k, …, 4W+k.</text><text x="38" y="551" font-size="13" font-weight="400" fill="#52667d" text-anchor="start">Rows wrap modulo H; the three dashed paths illustrate potential reuse only, not implemented rotating state.</text></g></svg>