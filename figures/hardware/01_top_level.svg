<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="595" viewBox="0 0 1200 595" role="img"><title>Shared top-level hardware and frame protocol</title><desc>dwt53_frame · compile-time ARCH selection · single-level periodic CDF 5/3</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#647b92"/></marker><marker id="ctrl" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#95713a"/></marker></defs><rect width="1200" height="595" fill="#f7f9fc"/><rect width="1200" height="86" fill="#e8f0f8"/><g font-family="Arial, sans-serif" fill="#14283e"><text x="28" y="35" font-size="27" font-weight="700" fill="#14283e" text-anchor="start">Shared top-level hardware and frame protocol</text><text x="29" y="62" font-size="15" font-weight="400" fill="#52667d" text-anchor="start">dwt53_frame · compile-time ARCH selection · single-level periodic CDF 5/3</text><rect x="28" y="150" width="150" height="88" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="103" y="180" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Pixel source</text><text x="103" y="199" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">in_pixel[7:0]</text><text x="103" y="218" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">valid / ready</text><rect x="218" y="150" width="178" height="88" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="307" y="180" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Input frame</text><text x="307" y="199" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">frame[0:N−1]</text><text x="307" y="218" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">N × 8 bits</text><rect x="446" y="150" width="230" height="88" rx="8" fill="#d8eee6" stroke="#a2b4c7" stroke-width="1.5"/><text x="561" y="180" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">ARCH datapath</text><text x="561" y="199" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">FIR / lifting / 2-D</text><text x="561" y="218" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">or line / tile / folded</text><rect x="727" y="150" width="180" height="88" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="817" y="180" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Output store</text><text x="817" y="199" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">coeff[0:N−1]</text><text x="817" y="218" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">N × signed 32</text><rect x="956" y="150" width="216" height="88" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="1064" y="180" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Coefficient sink</text><text x="1064" y="199" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">coeff / index / last</text><text x="1064" y="218" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">valid / ready</text><polyline points="178,194 218,194" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><polyline points="396,194 446,194" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><polyline points="676,194 727,194" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><polyline points="907,194 956,194" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="442" y="292" width="238" height="79" rx="8" fill="#e9e5f7" stroke="#a2b4c7" stroke-width="1.5"/><text x="561" y="317.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Working storage</text><text x="561" y="336.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">mid / linebuf / patch</text><text x="561" y="355.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">selected by ARCH</text><polyline points="525,238 525,292" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="505" y="270" font-size="12" font-weight="400" fill="#52667d" text-anchor="middle">write</text><polyline points="604,292 604,238" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="626" y="270" font-size="12" font-weight="400" fill="#52667d" text-anchor="middle">read</text><rect x="28" y="424" width="370" height="82" rx="8" fill="#fff1d2" stroke="#a2b4c7" stroke-width="1.5"/><text x="213" y="451" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Global frame controller</text><text x="213" y="470" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">LOAD → compute → DRAIN</text><text x="213" y="489" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">state / input_idx / output_idx</text><rect x="442" y="424" width="370" height="82" rx="8" fill="#fff1d2" stroke="#a2b4c7" stroke-width="1.5"/><text x="627" y="451" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Address &amp; schedule counters</text><text x="627" y="470" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">pass_no / inner_idx / outer_idx</text><text x="627" y="489" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">or oy / ox / tile / phase</text><rect x="856" y="424" width="316" height="82" rx="8" fill="#fff1d2" stroke="#a2b4c7" stroke-width="1.5"/><text x="1014" y="451" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Reset and flow control</text><text x="1014" y="470" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">synchronous rst</text><text x="1014" y="489" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">hold output under backpressure</text><polyline points="398,465 442,465" fill="none" stroke="#95713a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ctrl)"/><polyline points="627,424 627,394 560,394 560,371" fill="none" stroke="#95713a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ctrl)"/><polyline points="210,424 210,258 307,258 307,238" fill="none" stroke="#95713a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ctrl)"/><polyline points="1014,424 1014,265 1064,265 1064,238" fill="none" stroke="#95713a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ctrl)"/><text x="28" y="550" font-size="13" font-weight="400" fill="#52667d" text-anchor="start">Data arrows: solid  ·  Controller/address arrows: dashed  ·  Memory: blue / violet  ·  Compute: green</text><text x="28" y="572" font-size="13" font-weight="400" fill="#52667d" text-anchor="start">All six configurations load the whole frame before computing and drain a packed frame afterward.</text></g></svg>