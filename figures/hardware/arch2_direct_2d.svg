"86" rx="8" fill="#d8eee6" stroke="#a2b4c7" stroke-width="1.5"/><text x="600" y="168.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">4 filter sums</text><text x="600" y="187.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">LL, LH, HL, HH</text><polyline points="696,173 742,173" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="742" y="130" width="192" height="86" rx="8" fill="#ffffff" stroke="#a2b4c7" stroke-width="1.5"/><text x="838" y="168.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Quartet writer</text><text x="838" y="187.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">emit_direct()</text><polyline points="934,173 980,173" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="980" y="130" width="192" height="86" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="1076" y="168.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Output frame</text><text x="1076" y="187.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">N × 32 bits</text><rect x="29" y="266" width="343" height="83" rx="8" fill="#fff1d2" stroke="#a2b4c7" stroke-width="1.5"/><text x="200.5" y="293.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">DIRECT controller</text><text x="200.5" y="312.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">oy, ox</text><text x="200.5" y="331.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">advance output quartet</text><rect x="430" y="266" width="343" height="83" rx="8" fill="#fff1d2" stroke="#a2b4c7" stroke-width="1.5"/><text x="601.5" y="293.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Global wrap</text><text x="601.5" y="312.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">center (2oy,2ox)</text><text x="601.5" y="331.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">direct_band()</text><rect x="831" y="266" width="341" height="83" rx="8" fill="#e9e5f7" stroke="#a2b4c7" stroke-width="1.5"/><text x="1001.5" y="293.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">No intermediate</text><text x="1001.5" y="312.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">four combinational sums</text><text x="1001.5" y="331.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">output store only</text><polyline points="372,307 430,307" fill="none" stroke="#95713a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ctrl)"/><polyline points="601,266 601,244 362,244 362,216" fill="none" stroke="#95713a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ctrl)"/><polyline points="201,266 201,235 838,235 838,216" fill="none" stroke="#95713a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ctrl)"/><polyline points="1001,266 1001,250 600,250 600,216" fill="none" stroke="#95713a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ctrl)"/><text x="27" y="395" font-size="14" font-weight="700" fill="#52667d" text-anchor="start">CONTROLLER SCHEDULE</text><rect x="28" y="412" width="369.3333333333333" height="66" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="212.66666666666666" y="440.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">LOAD</text><text x="212.66666666666666" y="459.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">N input handshakes</text><polyline points="397.3333333333333,445 415.3333333333333,445" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="415.3333333333333" y="412" width="369.3333333333333" height="66" rx="8" fill="#d8eee6" stroke="#a2b4c7" stroke-width="1.5"/><text x="600" y="440.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">DIRECT</text><text x="600" y="459.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">N/4 clocks</text><polyline points="784.6666666666666,445 802.6666666666666,445" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="802.6666666666666" y="412" width="369.3333333333333" height="66" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="987.3333333333333" y="440.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">DRAIN</text><text x="987.3333333333333" y="459.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">N output handshakes</text><text x="28" y="517" font-size="18" font-weight="700" fill="#14283e" text-anchor="start">Compute: N/4 clocks · no full intermediate store</text><text x="28" y="550" font-size="13" font-weight="400" fill="#52667d" text-anchor="start">Each clock emits a complete LL/LH/HL/HH quartet at the same decimated location.</text><text x="28" y="575" font-size="13" font-weight="400" fill="#52667d" text-anchor="start">All masks share one conceptual neighborhood; the RTL functions may duplicate read logic before synthesis.</text><text x="28" y="600" font-size="13" font-weight="400" fill="#52667d" text-anchor="start">The direct path requires 25 distinct logical window positions and four writes; banked memory is a design task.</text><text x="28" y="657" font-size="13" font-weight="400" fill="#52667d" text-anchor="start">Data path illustration is logical, not a physical post-synthesis netlist. Input/output stalls are excluded from compute clocks.</text></g></svg>