<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="685" viewBox="0 0 1200 685" role="img"><title>Row-column FIR</title><desc>ARCH=0 · frame → row pairs → full intermediate → column pairs → output</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#647b92"/></marker><marker id="ctrl" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#95713a"/></marker></defs><rect width="1200" height="685" fill="#f7f9fc"/><rect width="1200" height="86" fill="#e8f0f8"/><g font-family="Arial, sans-serif" fill="#14283e"><text x="28" y="35" font-size="27" font-weight="700" fill="#14283e" text-anchor="start">Row-column FIR</text><text x="29" y="62" font-size="15" font-weight="400" fill="#52667d" text-anchor="start">ARCH=0 · frame → row pairs → full intermediate → column pairs → output</text><text x="27" y="111" font-size="14" font-weight="700" fill="#52667d" text-anchor="start">DATA PATH</text><rect x="28" y="130" width="192" height="86" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="124" y="168.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Input frame</text><text x="124" y="187.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">N × 8 bits</text><polyline points="220,173 266,173" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="266" y="130" width="192" height="86" rx="8" fill="#ffffff" stroke="#a2b4c7" stroke-width="1.5"/><text x="362" y="168.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Row / column mux</text><text x="362" y="187.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">five periodic taps</text><polyline points="458,173 504,173" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="504" y="130" width="192" height="86" rx="8" fill="#d8eee6" stroke="#a2b4c7" stroke-width="1.5"/><text x="600" y="168.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">FIR pair</text><text x="600" y="187.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">L8 and H8</text><polyline points="696,173 742,173" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="742" y="130" width="192" height="86" rx="8" fill="#ffffff" stroke="#a2b4c7" stroke-width="1.5"/><text x="838" y="168.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Pass write mux</text><text x="838" y="187.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">mid or coeff</text><polyline points="934,173 980,173" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="980" y="130" width="192" height="86" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="1076" y="168.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Output frame</text><text x="1076" y="187.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">N × 32 bits</text><rect x="29" y="266" width="343" height="83" rx="8" fill="#fff1d2" stroke="#a2b4c7" stroke-width="1.5"/><text x="200.5" y="293.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">SEP controller</text><text x="200.5" y="312.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">pass_no=0 rows</text><text x="200.5" y="331.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">pass_no=1 columns</text><rect x="430" y="266" width="343" height="83" rx="8" fill="#fff1d2" stroke="#a2b4c7" stroke-width="1.5"/><text x="601.5" y="293.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Address generator</text><text x="601.5" y="312.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">outer_idx, inner_idx</text><text x="601.5" y="331.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">wrap(), axis_sample()</text><rect x="831" y="266" width="341" height="83" rx="8" fill="#e9e5f7" stroke="#a2b4c7" stroke-width="1.5"/><text x="1001.5" y="293.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">mid array</text><text x="1001.5" y="312.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">N × signed 32</text><text x="1001.5" y="331.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">first-pass scale ×8</text><polyline points="372,307 430,307" fill="none" stroke="#95713a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ctrl)"/><polyline points="601,266 601,244 362,244 362,216" fill="none" stroke="#95713a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ctrl)"/><polyline points="201,266 201,235 838,235 838,216" fill="none" stroke="#95713a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ctrl)"/><polyline points="1001,266 1001,250 600,250 600,216" fill="none" stroke="#95713a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ctrl)"/><polyline points="838,130 838,106 600,106 600,121" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="730" y="117" font-size="13" font-weight="400" fill="#52667d" text-anchor="start">pass feedback via mid</text><text x="27" y="395" font-size="14" font-weight="700" fill="#52667d" text-anchor="start">CONTROLLER SCHEDULE</text><rect x="28" y="412" width="272.5" height="66" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="164.25" y="440.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">LOAD</text><text x="164.25" y="459.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">N input handshakes</text><polyline points="300.5,445 318.5,445" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="318.5" y="412" width="272.5" height="66" rx="8" fill="#d8eee6" stroke="#a2b4c7" stroke-width="1.5"/><text x="454.75" y="440.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">ROW PASS</text><text x="454.75" y="459.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">N/2 clocks</text><polyline points="591,445 609,445" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="609" y="412" width="272.5" height="66" rx="8" fill="#d8eee6" stroke="#a2b4c7" stroke-width="1.5"/><text x="745.25" y="440.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">COLUMN PASS</text><text x="745.25" y="459.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">N/2 clocks</text><polyline points="881.5,445 899.5,445" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="899.5" y="412" width="272.5" height="66" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="1035.75" y="440.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">DRAIN</text><text x="1035.75" y="459.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">N output handshakes</text><text x="28" y="517" font-size="18" font-weight="700" fill="#14283e" text-anchor="start">Compute: N clocks · working store: 32N bits</text><text x="28" y="550" font-size="13" font-weight="400" fill="#52667d" text-anchor="start">One logical pair per compute clock; first pass packs horizontal low/high halves.</text><text x="28" y="575" font-size="13" font-weight="400" fill="#52667d" text-anchor="start">Column pass consumes the full intermediate array and packs vertical halves.</text><text x="28" y="600" font-size="13" font-weight="400" fill="#52667d" text-anchor="start">The RTL describes five logical reads and two writes per pair; physical RAM banking is not implemented.</text><text x="28" y="657" font-size="13" font-weight="400" fill="#52667d" text-anchor="start">Data path illustration is logical, not a physical post-synthesis netlist. Input/output stalls are excluded from compute clocks.</text></g></svg>