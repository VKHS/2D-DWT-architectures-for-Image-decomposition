<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img"><title>CDF 5/3 FIR processing element</title><desc>Five signed samples; exact output numerator with scale ×8 per pass; shifts are constant wiring</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#647b92"/></marker><marker id="ctrl" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#95713a"/></marker></defs><rect width="1200" height="670" fill="#f7f9fc"/><rect width="1200" height="86" fill="#e8f0f8"/><g font-family="Arial, sans-serif" fill="#14283e"><text x="28" y="35" font-size="27" font-weight="700" fill="#14283e" text-anchor="start">CDF 5/3 FIR processing element</text><text x="29" y="62" font-size="15" font-weight="400" fill="#52667d" text-anchor="start">Five signed samples; exact output numerator with scale ×8 per pass; shifts are constant wiring</text><rect x="42" y="111" width="195" height="53" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="139.5" y="142.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">a = x[2j−2]</text><rect x="42" y="210" width="195" height="64" rx="8" fill="#ffffff" stroke="#a2b4c7" stroke-width="1.5"/><text x="139.5" y="247" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">−a</text><polyline points="139,164 139,210" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><polyline points="139,274 139,308 600,308 600,334" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="270" y="111" width="195" height="53" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="367.5" y="142.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">b = x[2j−1]</text><rect x="270" y="210" width="195" height="64" rx="8" fill="#ffffff" stroke="#a2b4c7" stroke-width="1.5"/><text x="367.5" y="247" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">2b = b &lt;&lt; 1</text><polyline points="367,164 367,210" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><polyline points="367,274 367,308 600,308 600,334" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="498" y="111" width="195" height="53" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="595.5" y="142.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">c = x[2j]</text><rect x="498" y="210" width="195" height="64" rx="8" fill="#ffffff" stroke="#a2b4c7" stroke-width="1.5"/><text x="595.5" y="247" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">6c = (c &lt;&lt; 2)+(c &lt;&lt; 1)</text><polyline points="595,164 595,210" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><polyline points="595,274 595,308 600,308 600,334" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="726" y="111" width="195" height="53" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="823.5" y="142.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">d = x[2j+1]</text><rect x="726" y="210" width="195" height="64" rx="8" fill="#ffffff" stroke="#a2b4c7" stroke-width="1.5"/><text x="823.5" y="247" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">2d = d &lt;&lt; 1</text><polyline points="823,164 823,210" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><polyline points="823,274 823,308 600,308 600,334" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="954" y="111" width="195" height="53" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="1051.5" y="142.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">e = x[2j+2]</text><rect x="954" y="210" width="195" height="64" rx="8" fill="#ffffff" stroke="#a2b4c7" stroke-width="1.5"/><text x="1051.5" y="247" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">−e</text><polyline points="1051,164 1051,210" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><polyline points="1051,274 1051,308 600,308 600,334" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="433" y="334" width="334" height="66" rx="8" fill="#d8eee6" stroke="#a2b4c7" stroke-width="1.5"/><text x="600" y="362.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Sum low-path terms</text><text x="600" y="381.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">L8 = −a + 2b + 6c + 2d − e</text><polyline points="600,400 600,434" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="433" y="434" width="334" height="59" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="600" y="468.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">low8 (signed 32)</text><rect x="33" y="532" width="345" height="70" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="205.5" y="562.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">High-path input branch</text><text x="205.5" y="581.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">c, d, e (same input window)</text><rect x="428" y="532" width="344" height="70" rx="8" fill="#d8eee6" stroke="#a2b4c7" stroke-width="1.5"/><text x="600" y="562.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">2d − c − e</text><text x="600" y="581.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">then shift left 2</text><rect x="822" y="532" width="344" height="70" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="994" y="562.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">high8 (signed 32)</text><text x="994" y="581.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">4(2d − c − e)</text><polyline points="378,567 428,567" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><polyline points="772,567 822,567" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="28" y="643" font-size="13" font-weight="400" fill="#52667d" text-anchor="start">Corresponds to lo8(), hi8() and dwt53_fir_pair. This is combinational arithmetic, not a registered pipeline.</text></g></svg>