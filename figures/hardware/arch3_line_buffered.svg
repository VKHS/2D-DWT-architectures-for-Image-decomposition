<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="685" viewBox="0 0 1200 685" role="img"><title>Five-row buffered FIR</title><desc>ARCH=3 · refill five horizontally filtered rows for each vertical output-row group</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#647b92"/></marker><marker id="ctrl" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#95713a"/></marker></defs><rect width="1200" height="685" fill="#f7f9fc"/><rect width="1200" height="86" fill="#e8f0f8"/><g font-family="Arial, sans-serif" fill="#14283e"><text x="28" y="35" font-size="27" font-weight="700" fill="#14283e" text-anchor="start">Five-row buffered FIR</text><text x="29" y="62" font-size="15" font-weight="400" fill="#52667d" text-anchor="start">ARCH=3 · refill five horizontally filtered rows for each vertical output-row group</text><text x="27" y="111" font-size="14" font-weight="700" fill="#52667d" text-anchor="start">DATA PATH</text><rect x="28" y="130" width="192" height="86" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="124" y="168.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Input frame</text><text x="124" y="187.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">N × 8 bits</text><polyline points="220,173 266,173" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="266" y="130" width="192" height="86" rx="8" fill="#ffffff" stroke="#a2b4c7" stroke-width="1.5"/><text x="362" y="168.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Horizontal FIR</text><text x="362" y="187.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">two outputs / pair</text><polyline points="458,173 504,173" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="504" y="130" width="192" height="86" rx="8" fill="#d8eee6" stroke="#a2b4c7" stroke-width="1.5"/><text x="600" y="168.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Five-row buffer</text><text x="600" y="187.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">5 × W signed words</text><polyline points="696,173 742,173" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="742" y="130" width="192" height="86" rx="8" fill="#ffffff" stroke="#a2b4c7" stroke-width="1.5"/><text x="838" y="168.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Vertical FIR</text><text x="838" y="187.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">two outputs / column</text><polyline points="934,173 980,173" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="980" y="130" width="192" height="86" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="1076" y="168.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Output frame</text><text x="1076" y="187.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">N × 32 bits</text><rect x="29" y="266" width="343" height="83" rx="8" fill="#fff1d2" stroke="#a2b4c7" stroke-width="1.5"/><text x="200.5" y="293.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">LINE_FILL / EMIT</text><text x="200.5" y="312.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">fill 5W/2 clocks</text><text x="200.5" y="331.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">emit W clocks</text><rect x="430" y="266" width="343" height="83" rx="8" fill="#fff1d2" stroke="#a2b4c7" stroke-width="1.5"/><text x="601.5" y="293.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Row/column counters</text><text x="601.5" y="312.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">oy, lr, ox, col_idx</text><text x="601.5" y="331.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">global periodic halo</text><rect x="831" y="266" width="341" height="83" rx="8" fill="#e9e5f7" stroke="#a2b4c7" stroke-width="1.5"/><text x="1001.5" y="293.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Row buffer layout</text><text x="1001.5" y="312.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">row slot lr = 0…4</text><text x="1001.5" y="331.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">low | high columns</text><polyline points="372,307 430,307" fill="none" stroke="#95713a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ctrl)"/><polyline points="601,266 601,244 362,244 362,216" fill="none" stroke="#95713a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ctrl)"/><polyline points="201,266 201,235 838,235 838,216" fill="none" stroke="#95713a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ctrl)"/><polyline points="1001,266 1001,250 600,250 600,216" fill="none" stroke="#95713a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ctrl)"/><text x="27" y="395" font-size="14" font-weight="700" fill="#52667d" text-anchor="start">CONTROLLER SCHEDULE</text><rect x="28" y="412" width="214.4" height="66" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="135.2" y="440.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">LOAD</text><text x="135.2" y="459.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">N input handshakes</text><polyline points="242.4,445 260.4,445" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="260.4" y="412" width="214.4" height="66" rx="8" fill="#d8eee6" stroke="#a2b4c7" stroke-width="1.5"/><text x="367.59999999999997" y="440.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">FILL</text><text x="367.59999999999997" y="459.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">5W/2 clocks</text><polyline points="474.79999999999995,445 492.79999999999995,445" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="492.8" y="412" width="214.4" height="66" rx="8" fill="#d8eee6" stroke="#a2b4c7" stroke-width="1.5"/><text x="600" y="440.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">EMIT</text><text x="600" y="459.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">W clocks</text><polyline points="707.2,445 725.2,445" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="725.2" y="412" width="214.4" height="66" rx="8" fill="#d8eee6" stroke="#a2b4c7" stroke-width="1.5"/><text x="832.4000000000001" y="440.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">REPEAT</text><text x="832.4000000000001" y="459.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">H/2 groups</text><polyline points="939.6,445 957.6,445" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="957.6" y="412" width="214.4" height="66" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="1064.8" y="440.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">DRAIN</text><text x="1064.8" y="459.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">N output handshakes</text><text x="28" y="517" font-size="18" font-weight="700" fill="#14283e" text-anchor="start">Compute: 7N/4 clocks · working store: 160W bits</text><text x="28" y="550" font-size="13" font-weight="400" fill="#52667d" text-anchor="start">For output row oy, cached source rows are wrap(2oy−2 … 2oy+2,H).</text><text x="28" y="575" font-size="13" font-weight="400" fill="#52667d" text-anchor="start">Vertical PE reads one packed column from all five row slots; writes low and high output rows.</text><text x="28" y="600" font-size="13" font-weight="400" fill="#52667d" text-anchor="start">Current RTL refills all five rows for every group. A rotating cache retaining 3 rows is an optimization, not this RTL.</text><text x="28" y="657" font-size="13" font-weight="400" fill="#52667d" text-anchor="start">Data path illustration is logical, not a physical post-synthesis netlist. Input/output stalls are excluded from compute clocks.</text></g></svg>