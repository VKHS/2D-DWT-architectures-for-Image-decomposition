<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="715" viewBox="0 0 1200 715" role="img"><title>Controller state transitions</title><desc>One frame at a time · compile-time branch based on ARCH · reset returns to LOAD</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#647b92"/></marker><marker id="ctrl" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#95713a"/></marker></defs><rect width="1200" height="715" fill="#f7f9fc"/><rect width="1200" height="86" fill="#e8f0f8"/><g font-family="Arial, sans-serif" fill="#14283e"><text x="28" y="35" font-size="27" font-weight="700" fill="#14283e" text-anchor="start">Controller state transitions</text><text x="29" y="62" font-size="15" font-weight="400" fill="#52667d" text-anchor="start">One frame at a time · compile-time branch based on ARCH · reset returns to LOAD</text><rect x="448" y="110" width="304" height="73" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="600" y="142" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">LOAD</text><text x="600" y="161" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">accept N pixels</text><rect x="28" y="258" width="262" height="82" rx="8" fill="#d8eee6" stroke="#a2b4c7" stroke-width="1.5"/><text x="159" y="285" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">SEP</text><text x="159" y="304" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">ARCH 0, 1, 5</text><text x="159" y="323" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">pass 0 / pass 1</text><polyline points="600,183 600,213 159,213 159,258" fill="none" stroke="#95713a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ctrl)"/><rect x="322" y="258" width="262" height="82" rx="8" fill="#d8eee6" stroke="#a2b4c7" stroke-width="1.5"/><text x="453" y="285" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">DIRECT</text><text x="453" y="304" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">ARCH 2</text><text x="453" y="323" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">N/4 quartets</text><polyline points="600,183 600,213 453,213 453,258" fill="none" stroke="#95713a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ctrl)"/><rect x="616" y="258" width="262" height="82" rx="8" fill="#d8eee6" stroke="#a2b4c7" stroke-width="1.5"/><text x="747" y="285" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">LINE_FILL</text><text x="747" y="304" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">ARCH 3</text><text x="747" y="323" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">5W/2 pair clocks</text><polyline points="600,183 600,213 747,213 747,258" fill="none" stroke="#95713a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ctrl)"/><rect x="910" y="258" width="262" height="82" rx="8" fill="#d8eee6" stroke="#a2b4c7" stroke-width="1.5"/><text x="1041" y="285" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">TILE_FILL</text><text x="1041" y="304" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">ARCH 4</text><text x="1041" y="323" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">P² pixel clocks</text><polyline points="600,183 600,213 1041,213 1041,258" fill="none" stroke="#95713a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ctrl)"/><rect x="616" y="393" width="262" height="82" rx="8" fill="#d8eee6" stroke="#a2b4c7" stroke-width="1.5"/><text x="747" y="420" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">LINE_EMIT</text><text x="747" y="439" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">W column clocks</text><text x="747" y="458" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">then next group</text><rect x="910" y="393" width="262" height="82" rx="8" fill="#d8eee6" stroke="#a2b4c7" stroke-width="1.5"/><text x="1041" y="420" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">TILE_EMIT</text><text x="1041" y="439" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">T² quartets</text><text x="1041" y="458" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">then next tile</text><polyline points="700,340 700,393" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><polyline points="794,393 794,340" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="845" y="370" font-size="12" font-weight="400" fill="#52667d" text-anchor="middle">more groups</text><polyline points="994,340 994,393" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><polyline points="1088,393 1088,340" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="1131" y="370" font-size="12" font-weight="400" fill="#52667d" text-anchor="middle">more tiles</text><rect x="448" y="556" width="304" height="72" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="600" y="587.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">DRAIN</text><text x="600" y="606.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">out_valid=1; advance on ready</text><polyline points="159,340 159,517 500,517 500,556" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="240" y="510" font-size="12" font-weight="400" fill="#52667d" text-anchor="middle">passes done</text><polyline points="453,340 453,498 548,498 548,556" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="490" y="490" font-size="12" font-weight="400" fill="#52667d" text-anchor="middle">done</text><polyline points="747,475 747,517 650,517 650,556" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="696" y="508" font-size="12" font-weight="400" fill="#52667d" text-anchor="middle">done</text><polyline points="1041,475 1041,536 700,536 700,556" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="908" y="529" font-size="12" font-weight="400" fill="#52667d" text-anchor="middle">done</text><polyline points="448,592 12,592 12,145 448,145" fill="none" stroke="#95713a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ctrl)"/><text x="187" y="137" font-size="12" font-weight="400" fill="#80602e" text-anchor="middle">last handshake</text><text x="28" y="675" font-size="13" font-weight="400" fill="#52667d" text-anchor="start">rst aborts the active frame and resets indices. No state overlap: LOAD, compute and DRAIN are mutually exclusive.</text><text x="28" y="695" font-size="13" font-weight="400" fill="#52667d" text-anchor="start">In SEP, ARCH 5 advances the pair only after phase 2; ARCH 0/1 advance every clock.</text></g></svg>