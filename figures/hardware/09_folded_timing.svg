_d+saved_prev</text><rect x="822" y="313" width="348" height="66" rx="8" fill="#dce9f8" stroke="#a2b4c7" stroke-width="1.5"/><text x="996" y="341.5" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">H8 = 4saved_d</text><text x="996" y="360.5" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">write_pair() / advance_pair()</text><polyline points="996,179 996,205" fill="none" stroke="#95713a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ctrl)"/><polyline points="996,274 996,313" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><polyline points="204,379 204,417 996,417 996,379" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="600" y="410" font-size="12" font-weight="400" fill="#52667d" text-anchor="middle">saved_d retained</text><polyline points="600,379 600,453 1060,453 1060,379" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="817" y="446" font-size="12" font-weight="400" fill="#52667d" text-anchor="middle">saved_prev retained</text><text x="30" y="494" font-size="13" font-weight="400" fill="#52667d" text-anchor="start">At phase 2, both prediction registers are already valid from earlier edges; pair indices advance only after the write.</text><text x="30" y="517" font-size="13" font-weight="400" fill="#52667d" text-anchor="start">Physical resource sharing and achievable clock rate must be confirmed by synthesis.</text></g></svg>