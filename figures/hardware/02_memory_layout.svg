<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"><title>Separable 2-D transform and memory addressing</title><desc>Horizontal first for ARCH 0/1; vertical first for ARCH 5; band names are vertical then horizontal</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#647b92"/></marker><marker id="ctrl" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#95713a"/></marker></defs><rect width="1200" height="650" fill="#f7f9fc"/><rect width="1200" height="86" fill="#e8f0f8"/><g font-family="Arial, sans-serif" fill="#14283e"><text x="28" y="35" font-size="27" font-weight="700" fill="#14283e" text-anchor="start">Separable 2-D transform and memory addressing</text><text x="29" y="62" font-size="15" font-weight="400" fill="#52667d" text-anchor="start">Horizontal first for ARCH 0/1; vertical first for ARCH 5; band names are vertical then horizontal</text><text x="42" y="119" font-size="19" font-weight="700" fill="#14283e" text-anchor="start">Input x[r,c]</text><rect x="42" y="140" width="240" height="220" rx="0" fill="#dce9f8" stroke="#a2b4c7"/><text x="162" y="255" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">H × W</text><line x1="72" y1="140" x2="72" y2="360" stroke="#c0cfdf" stroke-width="1.5" /><line x1="42" y1="167.5" x2="282" y2="167.5" stroke="#c0cfdf" stroke-width="1.5" /><line x1="102" y1="140" x2="102" y2="360" stroke="#c0cfdf" stroke-width="1.5" /><line x1="42" y1="195" x2="282" y2="195" stroke="#c0cfdf" stroke-width="1.5" /><line x1="132" y1="140" x2="132" y2="360" stroke="#c0cfdf" stroke-width="1.5" /><line x1="42" y1="222.5" x2="282" y2="222.5" stroke="#c0cfdf" stroke-width="1.5" /><line x1="162" y1="140" x2="162" y2="360" stroke="#c0cfdf" stroke-width="1.5" /><line x1="42" y1="250" x2="282" y2="250" stroke="#c0cfdf" stroke-width="1.5" /><line x1="192" y1="140" x2="192" y2="360" stroke="#c0cfdf" stroke-width="1.5" /><line x1="42" y1="277.5" x2="282" y2="277.5" stroke="#c0cfdf" stroke-width="1.5" /><line x1="222" y1="140" x2="222" y2="360" stroke="#c0cfdf" stroke-width="1.5" /><line x1="42" y1="305" x2="282" y2="305" stroke="#c0cfdf" stroke-width="1.5" /><line x1="252" y1="140" x2="252" y2="360" stroke="#c0cfdf" stroke-width="1.5" /><line x1="42" y1="332.5" x2="282" y2="332.5" stroke="#c0cfdf" stroke-width="1.5" /><polyline points="282,250 355,250" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="318.5" y="242" font-size="12" font-weight="400" fill="#52667d" text-anchor="middle">row PE</text><text x="362" y="119" font-size="19" font-weight="700" fill="#14283e" text-anchor="start">Intermediate mid</text><rect x="362" y="140" width="160" height="220" rx="0" fill="#d8eee6" stroke="#a2b4c7"/><text x="442" y="255" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Lx</text><rect x="522" y="140" width="160" height="220" rx="0" fill="#fff1d2" stroke="#a2b4c7"/><text x="602" y="255" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Hx</text><text x="442" y="390" font-size="13" font-weight="400" fill="#14283e" text-anchor="middle">j = 0…W/2−1</text><text x="602" y="390" font-size="13" font-weight="400" fill="#14283e" text-anchor="middle">j + W/2</text><polyline points="682,250 762,250" fill="none" stroke="#647b92" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="722" y="242" font-size="12" font-weight="400" fill="#52667d" text-anchor="middle">column PE</text><text x="769" y="119" font-size="19" font-weight="700" fill="#14283e" text-anchor="start">Packed output coeff</text><rect x="769" y="140" width="190" height="110" rx="0" fill="#d8eee6" stroke="#a2b4c7"/><text x="864" y="200" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">LL</text><rect x="959" y="140" width="190" height="110" rx="0" fill="#fff1d2" stroke="#a2b4c7"/><text x="1054" y="200" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">LH</text><rect x="769" y="250" width="190" height="110" rx="0" fill="#dce9f8" stroke="#a2b4c7"/><text x="864" y="310" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">HL</text><rect x="959" y="250" width="190" height="110" rx="0" fill="#e9e5f7" stroke="#a2b4c7"/><text x="1054" y="310" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">HH</text><text x="959" y="390" font-size="13" font-weight="400" fill="#14283e" text-anchor="middle">Each band H/2 × W/2</text><rect x="42" y="436" width="350" height="118" rx="8" fill="#ffffff" stroke="#a2b4c7" stroke-width="1.5"/><text x="217" y="481" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Input index</text><text x="217" y="500" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">rW + c</text><text x="217" y="519" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">global wrap before linearization</text><rect x="425" y="436" width="350" height="118" rx="8" fill="#ffffff" stroke="#a2b4c7" stroke-width="1.5"/><text x="600" y="481" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Horizontal pair writes</text><text x="600" y="500" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">low: rW + j</text><text x="600" y="519" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">high: rW + j + W/2</text><rect x="808" y="436" width="341" height="118" rx="8" fill="#ffffff" stroke="#a2b4c7" stroke-width="1.5"/><text x="978.5" y="481" font-size="16" font-weight="700" fill="#14283e" text-anchor="middle">Vertical pair writes</text><text x="978.5" y="500" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">low: iW + c</text><text x="978.5" y="519" font-size="13" font-weight="400" fill="#52667d" text-anchor="middle">high: (i + H/2)W + c</text><text x="42" y="598" font-size="13" font-weight="400" fill="#52667d" text-anchor="start">Direct and tile engines write all four quadrant addresses for (i,j) in the same compute clock.</text><text x="42" y="620" font-size="13" font-weight="400" fill="#52667d" text-anchor="start">When ARCH=5, vertical processing creates top/bottom bands first; the final row pass yields the same layout.</text></g></svg>