<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" fill="#f4f7fb"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6Z" fill="#526579"/></marker></defs><text x="30" y="38" font-family="Arial" font-size="25" font-weight="bold" fill="#142c49">Six dataflow architectures | CDF 5/3</text><text x="30" y="80" font-family="Arial" font-size="16" font-weight="bold" fill="#142c49">1. Row-column FIR</text><rect x="30" y="90" width="180" height="43" rx="7" fill="#fff" stroke="#8aa0b7"/><text x="120" y="117" text-anchor="middle" font-family="Arial" font-size="14" fill="#142c49">Input frame</text><path d="M210 111h25" stroke="#526579" stroke-width="2" marker-end="url(#a)"/><rect x="240" y="90" width="180" height="43" rx="7" fill="#fff" stroke="#8aa0b7"/><text x="330" y="117" text-anchor="middle" font-family="Arial" font-size="14" fill="#142c49">Horizontal FIR</text><path d="M420 111h25" stroke="#526579" stroke-width="2" marker-end="url(#a)"/><rect x="450" y="90" width="180" height="43" rx="7" fill="#d9eae8" stroke="#8aa0b7"/><text x="540" y="117" text-anchor="middle" font-family="Arial" font-size="14" fill="#142c49">Frame store</text><path d="M630 111h25" stroke="#526579" stroke-width="2" marker-end="url(#a)"/><rect x="660" y="90" width="180" height="43" rx="7" fill="#fff" stroke="#8aa0b7"/><text x="750" y="117" text-anchor="middle" font-family="Arial" font-size="14" fill="#142c49">Vertical FIR</text><path d="M840 111h25" stroke="#526579" stroke-width="2" marker-end="url(#a)"/><rect x="870" y="90" width="180" height="43" rx="7" fill="#fff" stroke="#8aa0b7"/><text x="960" y="117" text-anchor="middle" font-family="Arial" font-size="14" fill="#142c49">Four bands</text><text x="30" y="168" font-family="Arial" font-size="16" font-weight="bold" fill="#142c49">2. Predict / update lifting</text><rect x="30" y="178" width="180" height="43" rx="7" fill="#fff" stroke="#8aa0b7"/><text x="120" y="205" text-anchor="middle" font-family="Arial" font-size="14" fill="#142c49">Even / odd split</text><path d="M210 199h25" stroke="#526579" stroke-width="2" marker-end="url(#a)"/><rect x="240" y="178" width="180" height="43" rx="7" fill="#fff" stroke="#8aa0b7"/><text x="330" y="205" text-anchor="middle" font-family="Arial" font-size="14" fill="#142c49">Predict detail</text><path d="M420 199h25" stroke="#526579" stroke-width="2" marker-end="url(#a)"/><rect x="450" y="178" width="180" height="43" rx="7" fill="#d9eae8" stroke="#8aa0b7"/><text x="540" y="205" text-anchor="middle" font-family="Arial" font-size="14" fill="#142c49">Update smooth</text><path d="M630 199h25" stroke="#526579" stroke-width="2" marker-end="url(#a)"/><rect x="660" y="178" width="180" height="43" rx="7" fill="#fff" stroke="#8aa0b7"/><text x="750" y="205" text-anchor="middle" font-family="Arial" font-size="14" fill="#142c49">Vertical lift</text><path d="M840 199h25" stroke="#526579" stroke-width="2" marker-end="url(#a)"/><rect x="870" y="178" width="180" height="43" rx="7" fill="#fff" stroke="#8aa0b7"/><text x="960" y="205" text-anchor="middle" font-family="Arial" font-size="14" fill="#142c49">Four bands</text><text x="30" y="256" font-family="Arial" font-size="16" font-weight="bold" fill="#142c49">3. Direct 2-D FIR</text><rect x="30" y="266" width="180" height="43" rx="7" fill="#fff" stroke="#8aa0b7"/><text x="120" y="293" text-anchor="middle" font-family="Arial" font-size="14" fill="#142c49">Input window</text><path d="M210 287h25" stroke="#526579" stroke-width="2" marker-end="url(#a)"/><rect x="240" y="266" width="180" height="43" rx="7" fill="#fff" stroke="#8aa0b7"/><text x="330" y="293" text-anchor="middle" font-family="Arial" font-size="14" fill="#142c49">Outer-product taps</text><path d="M420 287h25" stroke="#526579" stroke-width="2" marker-end="url(#a)"/><rect x="450" y="266" width="180" height="43" rx="7" fill="#d9eae8" stroke="#8aa0b7"/><text x="540" y="293" text-anchor="middle" font-family="Arial" font-size="14" fill="#142c49">Four accumulators</text><path d="M630 287h25" stroke="#526579" stroke-width="2" marker-end="url(#a)"/><rect x="660" y="266" width="180" height="43" rx="7" fill="#fff" stroke="#8aa0b7"/><text x="750" y="293" text-anchor="middle" font-family="Arial" font-size="14" fill="#142c49">Decimate x/y</text><path d="M840 287h25" stroke="#526579" stroke-width="2" marker-end="url(#a)"/><rect x="870" y="266" width="180" height="43" rx="7" fill="#fff" stroke="#8aa0b7"/><text x="960" y="293" text-anchor="middle" font-family="Arial" font-size="14" fill="#142c49">Four bands</text><text x="30" y="344" font-family="Arial" font-size="16" font-weight="bold" fill="#142c49">4. Line-buffered FIR</text><rect x="30" y="354" width="180" height="43" rx="7" fill="#fff" stroke="#8aa0b7"/><text x="120" y="381" text-anchor="middle" font-family="Arial" font-size="14" fill="#142c49">Raster rows</text><path d="M210 375h25" stroke="#526579" stroke-width="2" marker-end="url(#a)"/><rect x="240" y="354" width="180" height="43" rx="7" fill="#fff" stroke="#8aa0b7"/><text x="330" y="381" text-anchor="middle" font-family="Arial" font-size="14" fill="#142c49">Horizontal FIR</text><path d="M420 375h25" stroke="#526579" stroke-width="2" marker-end="url(#a)"/><rect x="450" y="354" width="180" height="43" rx="7" fill="#d9eae8" stroke="#8aa0b7"/><text x="540" y="381" text-anchor="middle" font-family="Arial" font-size="14" fill="#142c49">5-row cache</text><path d="M630 375h25" stroke="#526579" stroke-width="2" marker-end="url(#a)"/><rect x="660" y="354" width="180" height="43" rx="7" fill="#fff" stroke="#8aa0b7"/><text x="750" y="381" text-anchor="middle" font-family="Arial" font-size="14" fill="#142c49">Vertical FIR</text><path d="M840 375h25" stroke="#526579" stroke-width="2" marker-end="url(#a)"/><rect x="870" y="354" width="180" height="43" rx="7" fill="#fff" stroke="#8aa0b7"/><text x="960" y="381" text-anchor="middle" font-family="Arial" font-size="14" fill="#142c49">Four bands</text><text x="30" y="432" font-family="Arial" font-size="16" font-weight="bold" fill="#142c49">5. Halo-tiled FIR</text><rect x="30" y="442" width="180" height="43" rx="7" fill="#fff" stroke="#8aa0b7"/><text x="120" y="469" text-anchor="middle" font-family="Arial" font-size="14" fill="#142c49">Global image</text><path d="M210 463h25" stroke="#526579" stroke-width="2" marker-end="url(#a)"/><rect x="240" y="442" width="180" height="43" rx="7" fill="#fff" stroke="#8aa0b7"/><text x="330" y="469" text-anchor="middle" font-family="Arial" font-size="14" fill="#142c49">Tile + halo</text><path d="M420 463h25" stroke="#526579" stroke-width="2" marker-end="url(#a)"/><rect x="450" y="442" width="180" height="43" rx="7" fill="#d9eae8" stroke="#8aa0b7"/><text x="540" y="469" text-anchor="middle" font-family="Arial" font-size="14" fill="#142c49">Local 2-D FIR</text><path d="M630 463h25" stroke="#526579" stroke-width="2" marker-end="url(#a)"/><rect x="660" y="442" width="180" height="43" rx="7" fill="#fff" stroke="#8aa0b7"/><text x="750" y="469" text-anchor="middle" font-family="Arial" font-size="14" fill="#142c49">Crop valid outputs</text><path d="M840 463h25" stroke="#526579" stroke-width="2" marker-end="url(#a)"/><rect x="870" y="442" width="180" height="43" rx="7" fill="#fff" stroke="#8aa0b7"/><text x="960" y="469" text-anchor="middle" font-family="Arial" font-size="14" fill="#142c49">Four bands</text><text x="30" y="520" font-family="Arial" font-size="16" font-weight="bold" fill="#142c49">6. Folded lifting</text><rect x="30" y="530" width="180" height="43" rx="7" fill="#fff" stroke="#8aa0b7"/><text x="120" y="557" text-anchor="middle" font-family="Arial" font-size="14" fill="#142c49">Input frame</text><path d="M210 551h25" stroke="#526579" stroke-width="2" marker-end="url(#a)"/><rect x="240" y="530" width="180" height="43" rx="7" fill="#fff" stroke="#8aa0b7"/><text x="330" y="557" text-anchor="middle" font-family="Arial" font-size="14" fill="#142c49">Shared 1-D PE</text><path d="M420 551h25" stroke="#526579" stroke-width="2" marker-end="url(#a)"/><rect x="450" y="530" width="180" height="43" rx="7" fill="#d9eae8" stroke="#8aa0b7"/><text x="540" y="557" text-anchor="middle" font-family="Arial" font-size="14" fill="#142c49">Column pass</text><path d="M630 551h25" stroke="#526579" stroke-width="2" marker-end="url(#a)"/><rect x="660" y="530" width="180" height="43" rx="7" fill="#fff" stroke="#8aa0b7"/><text x="750" y="557" text-anchor="middle" font-family="Arial" font-size="14" fill="#142c49">Row pass (reuse)</text><path d="M840 551h25" stroke="#526579" stroke-width="2" marker-end="url(#a)"/><rect x="870" y="530" width="180" height="43" rx="7" fill="#fff" stroke="#8aa0b7"/><text x="960" y="557" text-anchor="middle" font-family="Arial" font-size="14" fill="#142c49">Four bands</text></svg>